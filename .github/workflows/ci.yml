# CI for the public, cross-industry product template.
#
# Deliberately NOT here: live smoke tests of the job-portal CLIs. They hit
# real portals (network-flaky, and the linkedin-search skill is personal-use
# only per its own ToS warning - CI-automated requests would violate that).
# CLIs get typechecked instead; live testing stays a local, on-demand step.
#
# Security posture: this template ships pre-approved Claude Code permissions
# and CLI code that every fork user executes, so the security-guards job
# fails PRs that widen settings.json permissions, weaken the personal-data
# gitignore rules, or add package lifecycle scripts; dependency-review flags
# newly introduced vulnerable/malicious dependencies. Honest limit: a PR can
# edit this workflow itself, so these guards catch accidents and casual
# attempts, not a determined author - branch protection with required checks
# and human review of workflow/settings diffs remain the real backstop.
# Actions are pinned to commit SHAs; the token is read-only.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills, commands, settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # All Python dependency installs go through the single install
      # contract (tools/setup_env.sh); no bare pip installs in CI.
      - run: bash tools/setup_env.sh --dev
      - run: python tools/lint_skills.py

  security-guards:
    name: Security guards (permissions, gitignore, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py
      - run: python tools/public_release_check.py --source

  python-tests:
    name: Python tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The maintained PDF path is DOCX + LibreOffice headless (see
      # CONTRIBUTING.md). The materials suites convert real DOCX files, so
      # the runner must provide soffice; without it pdf_generated fails and
      # the whole materials chain goes red for environmental reasons.
      - name: Install LibreOffice (headless PDF path)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          soffice --version
      # Same install contract as the README quickstart (tools/setup_env.sh).
      # --strict additionally requires headless LibreOffice for the PDF stage.
      - name: Install and verify environment (shared script)
        run: bash tools/setup_env.sh --dev --strict
      # Incremental type gate: only the modules listed in
      # tools/check_types.py block. The rest of the tree is a recorded,
      # non-blocking baseline (see docs/legacy_retirement.md).
      - name: Typecheck typed modules
        run: python tools/check_types.py
      - run: python -m pytest -q --cov=tools --cov-report=xml --cov-report=html --cov-report=term
      - name: Coverage baseline (non-blocking; thresholds in tools/coverage_thresholds.json)
        run: python tools/check_coverage.py
      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
      - run: python tools/fresh_24h/validate_queries.py

  sopcontrol-gate:
    name: SOP Control gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Read fixed SOP Control pin
        id: pin
        run: |
          pin=$(grep -E '^[0-9a-f]{40}$' tools/sopcontrol_pin.txt | head -1)
          test -n "$pin"
          echo "ref=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install vendored sopcontrol (pinned, with plugins)
        run: |
          test -f vendor/sopcontrol/sopcontrol/__init__.py
          test -f vendor/sopcontrol/plugins/__init__.py
          test -f vendor/sopcontrol/pyproject.toml
          test -f vendor/sopcontrol/VENDOR_MANIFEST.json
          test "$(cat vendor/sopcontrol/PIN.txt)" = "${{ steps.pin.outputs.ref }}"
          # Unified install contract (same script as README and python-tests):
          # hash lock first, then the vendored tree with --no-deps.  No bare
          # `pip install -e vendor/sopcontrol` anywhere in CI.
          bash tools/setup_env.sh --dev
          python -c "from plugins import DETECTORS, SENSORS; assert SENSORS and DETECTORS"
          python -c "import sopcontrol, json; m=json.load(open('vendor/sopcontrol/VENDOR_MANIFEST.json')); assert sopcontrol.__version__==m['version']"
      - name: Require portable control-plane files
        run: |
          test -f .sopcontrol/rules/registry.yaml
          test -f .sopcontrol/manifest.yaml
          test -f .sopcontrol/identity.yaml
          test -f .sopcontrol/harness-profile.yaml
      - name: sopctl doctor
        run: python -m sopcontrol.cli doctor .
      - name: sopctl gate
        run: python -m sopcontrol.cli gate .
      # A green governance gate only proves its own accepted rules passed.
      # It says nothing about the product build or test suite. Only the
      # ci-success aggregation below is the release signal.
      # 治理规则通过，不表示产品构建通过。
      - name: State gate scope
        run: echo "::notice::SOP Control gate passed for its accepted rules only; product release requires the ci-success job."

  python-compat:
    name: Python compatibility ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and verify environment
        run: bash tools/setup_env.sh --dev
      - name: Import and gateway compatibility smoke tests
        run: |
          python -c "import tools.workflow, sopcontrol; print('surface ok')"
          python -m sopcontrol.cli doctor .
          python -m pytest -q \
            tests/test_install_contract.py \
            tests/test_runtime_isolation.py \
            tests/test_private_write_gateway.py \
            tests/test_reset_gateway.py \
            -k 'not clean_venv_acceptance_from_scratch'

  dependency-review:
    name: Dependency review (upstream PRs only)
    # Requires the repo's Dependency graph, which forks never inherit and
    # which may be disabled upstream - so: upstream PRs only, and the
    # graph is probed first. If it is unavailable, the job warns and
    # passes instead of hard-failing (the same graceful-skip pattern the
    # workflow uses for optional tools). Enabling Dependency graph under
    # Settings -> Advanced Security activates the real check.
    if: github.event_name == 'pull_request' && github.repository == 'MadsLorentzen/ai-job-search'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Probe Dependency graph availability
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is not enabled on this repository (HTTP $code). Dependency review was skipped - enable Dependency graph under Settings -> Advanced Security to activate this check."
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  cli-typecheck:
    name: Typecheck ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - freehire-search
          - jobsdb-search
          - ctgoodjobs-search
          - linkedin-search
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun run typecheck
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun test
        working-directory: .agents/skills/${{ matrix.tool }}/cli

  # Single aggregation point for branch protection / rulesets: require
  # ci-success (not any individual job) so that a green governance gate
  # alone can never present as a passing build.
  ci-success:
    name: CI success (all required checks)
    runs-on: ubuntu-latest
    needs: [lint, security-guards, python-tests, sopcontrol-gate, python-compat, cli-typecheck]
    if: always()
    steps:
      - name: Verify every required job succeeded
        run: |
          python3 - <<'EOF'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {k: v.get("result") for k, v in needs.items() if v.get("result") != "success"}
          if failed:
              raise SystemExit(f"required jobs not green: {failed}")
          print("all required jobs succeeded")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
