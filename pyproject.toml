[project]
name = "jobsflow"
version = "1.1"
requires-python = ">=3.10"
dependencies = [
  "python-docx==1.2.0",
  "PyMuPDF==1.26.5",
  "pypdf==6.12.2",
  "openpyxl==3.1.5",
  "gspread==6.2.1",
  "google-auth==2.49.1",
  "google-api-python-client==2.193.0",
  "playwright==1.60.0",
  "PyYAML==6.0.3",
  "pydantic==2.13.5",
  "tree-sitter==0.26.0",
  "tree-sitter-go==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-rust==0.24.2",
]

# Optional extras. `advisory` powers the read-only TypeSafe judgment CLI; the
# gateway and the materials engine never import it, so the product installs and
# runs without it.
[project.optional-dependencies]
advisory = ["typesafe-sdk==0.7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not legacy and not retired_legacy'"
markers = [
  "legacy: frozen tests for the retired materials adapter; run explicitly with -m legacy",
  "retired_legacy: historical tests for the removed materials contract; excluded from release validation",
  "allows_chrome_launch_method: rebind the real Chrome settings launcher while subprocess.Popen stays stubbed",
  "allow_live_jd_fetch: opt out of the suite-wide jd_fetch stub",
]

[tool.coverage.run]
branch = true
source = ["tools"]
omit = ["tools/workflow/__pycache__/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
