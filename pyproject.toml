[project]
name = "jobsflow"
version = "0.7.0"
requires-python = ">=3.10"
dependencies = [
  "python-docx==1.2.0",
  "PyMuPDF==1.26.5",
  "pypdf==6.12.2",
  "openpyxl==3.1.5",
  "gspread==6.2.1",
  "google-auth==2.49.1",
  "google-api-python-client==2.193.0",
  "playwright==1.60.0",
  "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not legacy'"
markers = [
  "legacy: frozen tests for the retired materials adapter; run explicitly with -m legacy",
]
